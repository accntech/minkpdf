name: Stage npm release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to stage on npm
        required: true
        type: string
        default: v0.1.0

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.event.release.tag_name || inputs.release_tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - name: Install npm with staging support
        run: npm install --global npm@11.15.0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Set package version from release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          const tag = process.env.RELEASE_TAG;
          if (!/^v?\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$/.test(tag)) {
            throw new Error('Release tag must be a version such as v0.1.0 or v0.2.0-beta.1');
          }
          execFileSync('npm', ['version', tag.replace(/^v/, ''), '--no-git-tag-version', '--allow-same-version'], { stdio: 'inherit' });
          NODE

      - name: Install PDF test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes poppler-utils

      - name: Build package
        run: bun run build

      - name: Run PDF, package, and consumer tests
        run: bun test

      - name: Verify bundle size budgets
        run: bun benchmarks/tree-shaking.ts --compare-baseline=benchmarks/tree-shaking-baseline.json

      - name: Stage package for approval
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag=latest
          if [[ "$RELEASE_PRERELEASE" == "true" || "$version" == *-* ]]; then
            tag=next
          fi
          npm stage publish --provenance --access public --tag "$tag"

      - name: Add approval instructions
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'MARKDOWN'
          The npm release is staged and awaiting your approval.

          Open **Staged Packages** in your npm account, review `minkpdf`, and click **Approve** to publish it with 2FA.
          MARKDOWN
